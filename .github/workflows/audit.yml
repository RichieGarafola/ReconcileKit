name: Dependency audit

# Checks every pinned package in requirements-lock.txt against the PyPI/OSV advisory
# database. It runs on changes and weekly, because new advisories appear without any
# change to this repository. A finding fails the job; to accept one deliberately, add
# `--ignore-vuln <ID>` below with a comment explaining why.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the lockfile
        # --no-deps/--disable-pip: audit exactly the pinned set without resolving it again.
        run: pip-audit -r requirements-lock.txt --no-deps --disable-pip --progress-spinner off
